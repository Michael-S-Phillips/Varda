name: Check Linting, Formatting, and Unit Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  # Formatting check with ruff
  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase isn't fully ruff-formatted yet.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ruff format check
        run: uv run ruff format --check .

  # Linting check with ruff
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: existing lint backlog (~125 errors).
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check .

  # Static type checking with ty
  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    # Non-blocking for now: large type-checking backlog (~387 diagnostics).
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ty check
        run: uv run ty check

  # Unit testing with pytest
  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
